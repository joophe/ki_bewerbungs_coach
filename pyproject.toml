[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ki-bewerbungs-coach"
version = "0.2.0"
description = "Interaktiver KI-Coach für reflektierte und authentische Bewerbungsantworten."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
ki-bewerbungs-coach = "ki_bewerbungs_coach.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
