<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>This domain is now registered</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #23262b;
      --muted: #686f79;
      --line: #e2e5e9;
      --accent: #e20074;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .bar {
      height: 8px;
      background: var(--accent);
    }

    .content {
      padding: 56px 48px 48px;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.08;
      font-weight: 600;
    }

    p {
      margin: 0;
      max-width: 570px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.65;
    }

    footer {
      margin-top: 44px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .content {
        padding: 40px 28px 32px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="bar" aria-hidden="true"></div>
    <div class="content">
      <h1>This domain is now registered.</h1>
      <p>
        This website is currently being prepared. Please check back again soon.
      </p>
      <footer>Domain successfully connected.</footer>
    </div>
  </main>
</body>
</html>
